{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Detalle Atención</title>
    <link rel="stylesheet" href="{% static 'pacientes/css/estilos.css' %}">
</head>
<body>

<h1>Detalle de atención clínica</h1>

<table border="1" cellpadding="8">
    <tr>
        <th>ID Atención</th>
        <td>{{ atencion.id }}</td>
    </tr>

    <tr>
        <th>Paciente</th>
        <td>{{ atencion.paciente }}</td>
    </tr>

    <tr>
        <th>Médico</th>
        <td>{{ atencion.medico }}</td>
    </tr>

    <tr>
        <th>Motivo</th>
        <td>{{ atencion.motivo }}</td>
    </tr>

    <tr>
        <th>Fecha</th>
        <td>{{ atencion.fecha }}</td>
    </tr>

    <tr>
        <th>Estado</th>
        <td>{{ atencion.estado }}</td>
    </tr>
</table>

</body>
</html>
