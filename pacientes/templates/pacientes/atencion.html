{% extends "base.html" %}

    {% block titulo %}
        <title>Detalle de atención clínica</title>
    {% endblock %}
<h1></h1>
{%block contenido%}
<table class="tabla-pacientes">
    <tr>
        <th>ID Atención</th>
        <td>{{ atencion.id }}</td>
    </tr>

    <tr>
        <th>Paciente</th>
        <td>{{ atencion.paciente }}</td>
    </tr>

    <tr>
        <th>Médico</th>
        <td>{{ atencion.medico }}</td>
    </tr>

    <tr>
        <th>Motivo</th>
        <td>{{ atencion.motivo }}</td>
    </tr>

    <tr>
        <th>Fecha</th>
        <td>{{ atencion.fecha }}</td>
    </tr>

    <tr>
        <th>Estado</th>
        <td>{{ atencion.estado }}</td>
    </tr>
</table>
{%endblock%}
