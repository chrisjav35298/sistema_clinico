{% extends "base.html" %}
{% load static %}

{% block titulo %}
    <title>Crear paciente</title>
{% endblock %}

{% block estilos %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'pacientes/css/estilos.css' %}">
{% endblock %}
{% block contenido %}

<div class="container">
    <h3>Crear Nueva Especialidad</h3>
    <br>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>
<a href="{% url 'especialidades:menu_especialidades' %}" class="btn btn-primary">Volver al Menú</a>

{% endblock %}
